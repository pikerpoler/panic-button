[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19
    earlephilhower/ESP8266Audio@^1.9.7
build_flags =
    -DPANIC_DEBUG=1
    -I src
extra_scripts = pre:tools/pio_pre_generate_speech.py

[env:d1_mini_no_ota]
extends = env:d1_mini
board_build.ldscript = eagle.flash.4m2m.ld
